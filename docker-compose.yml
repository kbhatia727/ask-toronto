services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: toronto
      POSTGRES_PASSWORD: toronto
      POSTGRES_DB: torontoai
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrantdata:/qdrant/storage"]
volumes:
  pgdata:
  qdrantdata:
